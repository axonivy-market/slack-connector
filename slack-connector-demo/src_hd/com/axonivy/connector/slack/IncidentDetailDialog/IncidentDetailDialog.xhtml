<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/layouts/basic-10.xhtml">
		<ui:define name="title"> Incident Request</ui:define>
		<ui:define name="content">
			<h:outputStylesheet name="layouts/styles/incidentDetail.css" />

			<div class="incident-wrapper">
				<h:form id="form">
					<div class="incident-card">
						<h2 class="incident-title">Incident Severity:
							#{data.severity}</h2>
						<p class="incident-description">
							This is a demo for the Slack connector.<br /> Please select your
							role and then approve or reject this incident.
						</p>
						<div class="field-section">
							<p:outputLabel for="responsible" value="Please select a module"
								styleClass="field-label" />
							<p:selectOneMenu id="responsible" value="#{data.responsible}"
								required="true" styleClass="full-width-select">
								<f:selectItem itemLabel="Select responsible" itemValue=""
									noSelectionOption="true" />
								<f:selectItem itemLabel="Developer" itemValue="Developer" />
								<f:selectItem itemLabel="Manager" itemValue="Manager" />
								<f:selectItem itemLabel="Consultant" itemValue="Consultant" />
								<f:selectItem itemLabel="Administrator"
									itemValue="Administrator" />
							</p:selectOneMenu>
						</div>
						<div class="button-row">
							<p:commandLink id="cancel"
								actionListener="#{ivyWorkflowView.cancel()}" process="@this"
								value="Cancel" styleClass="cancel-btn" />
							<div class="action-buttons">
								<p:commandButton id="reject" actionListener="#{logic.reject}"
									value="Reject" update="form" icon="pi pi-times"
									styleClass="ui-button-outlined reject-btn" />
								<p:commandButton id="confirm" actionListener="#{logic.confirm}"
									value="Confirm" update="form" icon="pi pi-check"
									styleClass="confirm-btn" />
							</div>
						</div>
					</div>
				</h:form>
			</div>
		</ui:define>
	</ui:composition>
</h:body>
</html>
