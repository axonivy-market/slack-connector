<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pe="http://primefaces.org/ui/extensions">

<h:body>
	<ui:composition template="/layouts/basic-10.xhtml">
		<ui:define name="title"> Incident Request</ui:define>
		<ui:define name="content">
			<h3>Incident Severity: #{data.severity}
			</h3>
			<h:form id="form">
				<p:messages />
				<p:panelGrid columns="2" layout="grid"
					styleClass="ui-panelgrid-blank ui-fluid"
					columnClasses="ui-g-12 ui-md-3 ui-lg-2, ui-g-12 ui-md-9 ui-lg-4">
					<!-- Responsible -->
					<p:outputLabel for="responsible" value="Responsible" />
					<p:selectOneMenu id="responsible" value="#{data.responsible}">
						<f:selectItem itemLabel="Select responsible" itemValue=""
							noSelectionOption="true" />
						<f:selectItems value="#{incidentDetailBean.users}" var="user"
							itemLabel="#{user.displayName}" itemValue="#{user.displayName}" />
					</p:selectOneMenu>
				</p:panelGrid>
				<br />
				<div class="command-btns">
					<p:commandLink id="cancel"
						actionListener="#{ivyWorkflowView.cancel()}" process="@this"
						value="Cancel" />
					<p:commandButton id="reject" actionListener="#{logic.reject}"
						value="Reject" update="form" icon="pi pi-cancle" />
					<p:commandButton id="confirm" actionListener="#{logic.confirm}"
						value="Confirm" update="form" icon="pi pi-check" />
				</div>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
